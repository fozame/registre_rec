<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion — Registre du Recouvrement</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">

<div class="login-wrap">
  <div class="login-card">
    <div class="brand login-brand">
      <img src="/static/logo.png" alt="ART" class="brand-logo"
           onerror="this.hidden=true; document.getElementById('brand-fallback').hidden=false;">
      <span id="brand-fallback" class="brand-mark" hidden>ART</span>
    </div>
    <h1>Registre du Recouvrement</h1>
    <p class="subtitle-dark">Agence de Régulation des Télécommunications</p>
    <p class="subtitle-dark intro">Base cumulative des paiements reçus des opérateurs et des banques.</p>

    <form id="login-form" class="login-form">
      <label for="username">Nom d'utilisateur</label>
      <input type="text" id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Mot de passe</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <button type="submit" class="btn-primary login-submit">Se connecter</button>
      <p id="login-error" class="error-text" hidden></p>
    </form>
  </div>
</div>

<script>
(function () {
  "use strict";
  const form = document.getElementById("login-form");
  const errorEl = document.getElementById("login-error");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.hidden = true;
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    try {
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        errorEl.textContent = data.error || "Identifiants incorrects.";
        errorEl.hidden = false;
        return;
      }
      const params = new URLSearchParams(window.location.search);
      window.location.href = params.get("next") || "/";
    } catch (err) {
      errorEl.textContent = "Erreur réseau : " + err.message;
      errorEl.hidden = false;
    }
  });
})();
</script>
</body>
</html>
